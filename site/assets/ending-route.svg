<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 270" role="img" aria-labelledby="title"><title id="title">Safe ending order: Twisted Child, cure, Weaver Queen, Silk and Soul, Snared Silk, Act 3</title><rect width="1080" height="270" rx="20" fill="#13212a"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#f3e8d0"><text x="540" y="42" font-size="23">PRESERVE THE ACT 2 ENDINGS</text><g font-size="17"><text x="105" y="120">Twisted Child</text><text x="105" y="148" fill="#a7d8c5">while cursed</text><text x="320" y="120">Cure → Witch</text><text x="320" y="148" fill="#a7d8c5">permanent choice</text><text x="535" y="120">Weaver Queen</text><text x="535" y="148" fill="#a7d8c5">BIND, then reload</text><text x="750" y="120">Silk and Soul</text><text x="750" y="148" fill="#a7d8c5">after Tyrant event</text><text x="965" y="120">Snared Silk</text><text x="965" y="148" fill="#a7d8c5">Needolin → Act 3</text></g><text x="540" y="222" font-size="17">Curing closes Twisted Child. Snared Silk closes both earlier endings.</text></g><g fill="#caa66e"><path d="m202 125 20 -9v18z"/><path d="m417 125 20 -9v18z"/><path d="m632 125 20 -9v18z"/><path d="m847 125 20 -9v18z"/></g></svg>
